  </defs>
  <g transform="translate(100 100) scale(3.21875)">
    <rect width="256" height="256" rx="57.6" fill="#dfeee6" filter="url(#shadow)"/>
    <circle cx="128" cy="140" r="78" fill="#7cc4a0"/>
    <circle cx="128" cy="150" r="56" fill="#f6fbf8"/>
