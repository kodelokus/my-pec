<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Pip">
  <!-- app-icon.svg on Apple's macOS icon grid: an 824 body centred in 1024, corner radius 185, a soft shadow.
       Source of src-tauri/icons/icon.icns: pnpm tauri icon app-icon-macos.svg -o <folder>, then copy icon.icns. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
