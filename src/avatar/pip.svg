            <path d="M113 189Q128 177 143 189Q136 196.5 128 196.5Q120 196.5 113 189Z" fill="#f58f8f" stroke="none"/>
            <path d="M104 164Q128 171 152 164C152 185 142 197 128 197C114 197 104 185 104 164Z" stroke-width="4.5"/>
