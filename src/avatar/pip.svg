<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="pip" aria-hidden="true">
  <!-- Pip in parts. pip.css poses them from the data attributes pip.ts sets; ids starting "pip0-" are renamed per copy. -->
  <defs>
    <radialGradient id="pip0-body" cx=".36" cy=".24" r=".86">
      <stop offset="0" stop-color="#bceed3"/>
      <stop offset=".45" stop-color="#82cda8"/>
      <stop offset="1" stop-color="#56a682"/>
    </radialGradient>
    <clipPath id="pip0-face">
      <path d="M128 108C144 94 188 100 188 148C188 188 160 208 128 208C96 208 68 188 68 148C68 100 112 94 128 108Z"/>
    </clipPath>
  </defs>

  <g class="pip-tile">
    <rect class="pip-day" width="256" height="256" rx="56"/>
    <circle class="pip-glow" cx="128" cy="142" r="104"/>
    <g class="pip-night">
      <rect width="256" height="256" rx="56" fill="#27384d"/>
      <circle cx="46" cy="50" r="15" fill="#f8e9a9"/>
